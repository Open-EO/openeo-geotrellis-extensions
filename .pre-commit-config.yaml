# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Enable with the following commands:
#   python3 -m pip install pre-commit
#   pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # Real, unmodified Sentinel-2 MTD_TL.xml fixtures exceed 500 KB; see their READMEs.
        exclude: '^openeo-geotrellis/src/test/resources/org/openeo/geotrellis/layers/S2B_.*\.SAFE/GRANULE/.*/MTD_TL\.xml$'
      - id: check-json
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/akaihola/darker
    rev: v2.1.1
    hooks:
      - id: darker

# GitHub Actions port of the Jenkinsfile, using GitHub Packages (GHCR + Maven) instead of VITO Artifactory.
#
# Secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY            (Jenkins credential "SentinelHubBatchS3")
#   SENTINELHUB_CLIENT_ID / SENTINELHUB_CLIENT_SECRET    (Jenkins credential "SentinelHubGeodatadev")
#   DOWNSTREAM_DISPATCH_TOKEN (optional)                 PAT used to trigger the openeo-geopyspark-driver build
# Optional variables:
#   TEST_IMAGE           prebuilt image from docker/tests_dockerfile (its dnf repos are only reachable inside VITO,
#                        so it is built and pushed to GHCR manually)
#   TEST_HELPER_IMAGE    process graph test helper image
#   MAVEN_PACKAGES_URL   GitHub Packages Maven URL used to resolve non-Central dependencies
#   RUNNER_LABEL         runner to use (Jenkins used VITO nodes with /data, /eodata and hadoop conf mounts)

name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip running tests
        type: boolean
        default: false
      skip_sentinelhub_tests:
        description: Skip running Sentinel Hub tests
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  packages: write

env:
  TEST_IMAGE: ${{ vars.TEST_IMAGE || 'ghcr.io/open-eo/openeo-geotrellis-test-image:20250921_1' }}
  TEST_HELPER_IMAGE: ${{ vars.TEST_HELPER_IMAGE || 'ghcr.io/open-eo/geotrellis_process_graph_test_helper:latest' }}
  # Name hardcoded in ProcessGraphRunner; the GHCR image is re-tagged to it so tests use the local copy.
  TEST_HELPER_IMAGE_ALIAS: vito-docker.artifactory.vgt.vito.be/geotrellis_process_graph_test_helper:latest
  MAVEN_PACKAGES_URL: ${{ vars.MAVEN_PACKAGES_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
  MAVEN_DEPLOY_REPO: github::default::https://maven.pkg.github.com/${{ github.repository }}
  MAVEN_PROFILES: default,wmts

jobs:
  build:
    name: Build and Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 240
    outputs:
      version: ${{ steps.settings.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine build settings
        id: settings
        run: |
          revision=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml | head -n1)
          echo "version=${revision}" >> "$GITHUB_OUTPUT"

          opts=""
          # GitHub Packages can't serve Maven versions containing '+', so the copies there use '-' instead.
          geotrellis_version=$(sed -n 's:.*<geotrellis.version>\(.*\)</geotrellis.version>.*:\1:p' pom.xml | head -n1)
          opts+=" -Dgeotrellis.version=${geotrellis_version//+/-}"
          if [[ "${{ inputs.skip_tests }}" == "true" ]]; then
            echo "Maven will skip all tests"
            opts+=" -DskipTests=true -DskipSentinelHubTests=true"
          elif [[ "${{ inputs.skip_sentinelhub_tests }}" == "true" ]]; then
            echo "Maven will only skip Sentinel Hub tests"
            opts+=" -DskipSentinelHubTests=true"
          else
            echo "Maven will run all tests"
          fi

          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "$branch" != "master" && "$branch" != "develop" ]]; then
            # SNAPSHOT suffix so branch builds can be redeployed (GitHub Packages rejects overwriting releases).
            opts+=" -Drevision=${branch//\//-}-SNAPSHOT"
          fi

          {
            echo "MAVEN_EXTRA_OPTS=${opts}"
            # Only deploy on pushes/manual runs, not on pull requests.
            echo "DEPLOY=${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull "$TEST_IMAGE"

      - name: Pull process graph test helper
        run: |
          docker pull "$TEST_HELPER_IMAGE"
          docker tag "$TEST_HELPER_IMAGE" "$TEST_HELPER_IMAGE_ALIAS"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Write Maven settings
        run: ./.github/scripts/write-maven-settings.sh

      - name: Build, test and deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
        run: |
          goal=install
          deploy_opts=""
          if [[ "$DEPLOY" == "true" ]]; then
            goal=deploy
            deploy_opts="-DaltDeploymentRepository=${MAVEN_DEPLOY_REPO}"
          fi
          ./.github/scripts/run-in-test-image.sh \
            mvn -B -s /root/.m2/ci-settings.xml -P "$MAVEN_PROFILES" -U clean "$goal" $MAVEN_EXTRA_OPTS $deploy_opts

      - name: Publish test results
        if: always() && inputs.skip_tests != true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "*/target/*-reports/*.xml"
          require_tests: false

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Add required reviewers to this environment to replicate the Jenkins "Release build?" input step.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine release version
        run: |
          release_version="${{ needs.build.outputs.version }}"
          release_version="${release_version%-SNAPSHOT}"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          geotrellis_version=$(sed -n 's:.*<geotrellis.version>\(.*\)</geotrellis.version>.*:\1:p' pom.xml | head -n1)
          echo "GEOTRELLIS_VERSION=${geotrellis_version//+/-}" >> "$GITHUB_ENV"
          echo "Releasing version ${release_version}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull "$TEST_IMAGE"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Write Maven settings
        run: ./.github/scripts/write-maven-settings.sh

      - name: Use release dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/run-in-test-image.sh \
            mvn -B -s /root/.m2/ci-settings.xml versions:use-releases -DgenerateBackupPoms=false -DfailIfNotReplaced=true

      - name: Build and deploy release to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/run-in-test-image.sh \
            mvn -B -s /root/.m2/ci-settings.xml -P "$MAVEN_PROFILES" -U clean deploy \
              -Drevision="${RELEASE_VERSION}" -Dgeotrellis.version="${GEOTRELLIS_VERSION}" -DskipTests=true -DskipSentinelHubTests=true \
              -DaltDeploymentRepository="${MAVEN_DEPLOY_REPO}"

  trigger-downstream:
    name: Trigger geopyspark driver build
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch openeo-geopyspark-driver build
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "DOWNSTREAM_DISPATCH_TOKEN not configured, skipping."
            exit 0
          fi
          gh api repos/Open-EO/openeo-geopyspark-driver/dispatches \
            -f event_type=openeo-geotrellis-extensions-updated \
            -f "client_payload[ref]=${GITHUB_REF_NAME}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
